<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados — Mesas de Trabajo</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #F6F1FC; min-height: 100vh; }
    .results-container { max-width: 820px; margin: 0 auto; padding: 32px 16px; }
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .results-header img { height: 48px; object-fit: contain; }
    .results-card { background: white; border-radius: 16px; padding: 36px 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .team-title { color: #3A1259; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .team-meta { color: #6b7280; font-size: 15px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid #f3f4f6; }
    .section-block { margin-bottom: 28px; }
    .section-title { color: #7B3FA8; font-size: 17px; font-weight: 700; margin-bottom: 10px; }
    .section-body { background: #faf8fc; padding: 20px 24px; border-radius: 10px; border-left: 4px solid #7B3FA8; line-height: 1.7; }
    .field-label { color: #374151; display: block; margin-bottom: 3px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .field-value { color: #1f2937; font-size: 15px; margin-bottom: 12px; }
    .chip { display: inline-block; background: #E9A020; color: white; padding: 5px 14px; border-radius: 16px; font-size: 13px; font-weight: 500; margin: 3px 6px 3px 0; }
    .results-table { width: 100%; font-size: 13px; border-collapse: collapse; }
    .results-table th { padding: 10px; text-align: left; background: #f3f4f6; }
    .results-table td { padding: 10px; border-bottom: 1px solid #e5e7eb; }
    .actions-bar { text-align: center; margin-top: 32px; }
    .btn-pdf { background: #7B3FA8; color: white; border: none; padding: 14px 36px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(123,63,168,0.3); transition: all 0.2s; }
    .btn-pdf:hover { background: #3A1259; }
    .loading { text-align: center; padding: 80px 20px; color: #6b7280; font-size: 18px; }
    .not-ready { text-align: center; padding: 80px 20px; }
    .not-ready h2 { color: #3A1259; margin-bottom: 12px; }
    .not-ready p { color: #6b7280; font-size: 16px; }
    @media (max-width: 600px) {
      .results-card { padding: 24px 18px; }
      .results-header { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="results-container">
    <div class="results-header">
      <img src="/img/lhh-logo.webp" alt="LHH">
      <img id="companyLogo" src="" alt="" style="display:none;">
    </div>
    <div id="content">
      <div class="loading">Cargando resultados...</div>
    </div>
  </div>

  <script>
    const qId = window.location.pathname.split('/')[2];

    async function loadResults() {
      try {
        const res = await fetch(`/api/questionnaires/${qId}`);
        if (!res.ok) throw new Error('No encontrado');
        const q = await res.json();

        if (q.company_logo) {
          const logo = document.getElementById('companyLogo');
          logo.src = q.company_logo;
          logo.style.display = 'inline-block';
        }

        if (q.status !== 'submitted') {
          document.getElementById('content').innerHTML = `
            <div class="not-ready">
              <div style="font-size:56px; margin-bottom:16px;">⏳</div>
              <h2>Cuestionario en progreso</h2>
              <p>Este equipo aún no ha enviado sus respuestas.</p>
            </div>`;
          return;
        }

        const r = typeof q.responses === 'string' ? JSON.parse(q.responses) : q.responses;
        const teamName = q.team_name || '';
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; };

        const field = (label, value) => value ? `<div style="margin-bottom:12px;"><span class="field-label">${label}</span><span class="field-value">${esc(value)}</span></div>` : '';
        const chips = (items) => (items || []).map(i => `<span class="chip">${esc(i)}</span>`).join('');

        const section = (icon, title, body) => body.trim() ? `
          <div class="section-block">
            <div class="section-title">${icon} ${title}</div>
            <div class="section-body">${body}</div>
          </div>` : '';

        const impactoRows = (r.impacto || []).filter(i => i.resultado).map(i => `
          <tr><td>${esc(i.resultado)}</td><td>${esc(i.indicador)}</td><td>${esc(i.meta)}</td></tr>`).join('');

        const riesgoRows = (r.riesgos || []).filter(i => i.riesgo).map(i => `
          <tr><td>${esc(i.riesgo)}</td><td>${esc(i.mitigacion)}</td></tr>`).join('');

        document.getElementById('content').innerHTML = `
          <div class="results-card">
            <div class="team-title">${esc(teamName)}</div>
            <div class="team-meta">${esc(r.nombre_iniciativa)} &nbsp;·&nbsp; ${esc(r.lider_equipo)} &nbsp;·&nbsp; ${r.fecha || ''}</div>

            ${section('🎯', 'Reto de Negocio',
              field('Problema / Oportunidad', r.reto?.problema) +
              field('Evidencias', r.reto?.evidencias) +
              (r.reto?.impactos?.length ? `<div style="margin-bottom:12px;"><span class="field-label">Impactos</span>${chips(r.reto.impactos)}</div>` : '') +
              field('Descripción', r.reto?.descripcion)
            )}

            ${section('💡', 'Solución',
              field('Propuesta', r.solucion?.propuesta) +
              field('Diferenciadores', r.solucion?.diferenciadores)
            )}

            ${impactoRows ? section('📊', 'Impacto Esperado', `
              <table class="results-table">
                <thead><tr><th>Resultado</th><th>Indicador</th><th>Meta</th></tr></thead>
                <tbody>${impactoRows}</tbody>
              </table>`) : ''}

            ${section('🛠️', 'Recursos',
              (r.recursos?.tipos?.length ? `<div style="margin-bottom:12px;">${chips(r.recursos.tipos)}</div>` : '') +
              field('Detalle', r.recursos?.detalle)
            )}

            ${riesgoRows ? section('⚠️', 'Riesgos', `
              <table class="results-table">
                <thead><tr><th>Riesgo</th><th>Mitigación</th></tr></thead>
                <tbody>${riesgoRows}</tbody>
              </table>`) : ''}

            ${r.necesidades ? section('📌', 'Necesidades Adicionales', field('', r.necesidades)) : ''}
          </div>

          <div class="actions-bar">
            <button class="btn-pdf" onclick="downloadPDF()">📄 Descargar PDF</button>
          </div>
        `;
      } catch (e) {
        document.getElementById('content').innerHTML = `
          <div class="not-ready">
            <div style="font-size:56px; margin-bottom:16px;">❌</div>
            <h2>Error</h2>
            <p>No se pudo cargar el cuestionario.</p>
          </div>`;
      }
    }

    function downloadPDF() {
      const link = document.createElement('a');
      link.href = `/api/questionnaires/${qId}/pdf`;
      link.download = '';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    loadResults();
  </script>
</body>
</html>
